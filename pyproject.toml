[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cism"
version = "0.1.0"
description = "Context-dependent Identification of Spatial Motifs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alphashape",
    "joblib",
    "matplotlib",
    "networkx",
    "numpy",
    "opencv-python",
    "optuna",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
    "shap",
    "shapely",
    "torch",
    "torch-geometric",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["cism", "cism.*", "baselines", "baselines.*"]

[tool.setuptools.package-data]
cism = ["FANMOD_binaries/*", "FANMOD_binaries/**/*"]
